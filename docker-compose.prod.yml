version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: summar-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - summar-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: summar-backend
    env_file:
      - .env.production
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - summar-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: summar-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_APP_NAME=Summar.me
      - NEXT_PUBLIC_APP_URL=https://summar.me
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - summar-network

networks:
  summar-network:
    driver: bridge