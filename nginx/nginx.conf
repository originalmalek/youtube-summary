events {
      worker_connections 1024;
  }

  http {
      upstream frontend {
          server frontend:3000;
      }

      upstream backend {
          server backend:8000;
      }

      server {
          listen 80;
          server_name summar.me www.summar.me;
          return 301 https://$server_name$request_uri;
      }

      server {
          listen 443 ssl;
          http2 on;
          server_name summar.me www.summar.me;

          ssl_certificate
  /etc/letsencrypt/live/summar.me/fullchain.pem;
          ssl_certificate_key
  /etc/letsencrypt/live/summar.me/privkey.pem;

          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers HIGH:!aNULL:!MD5;

          # Backend API - передать как есть
          location /api/ {
              proxy_pass http://backend/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For
  $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # Backend корневые эндпоинты
          location ~ ^/(health|docs|openapi\.json) {
              proxy_pass http://backend;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For
  $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # Frontend - всё остальное
          location / {
              proxy_pass http://frontend;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_cache_bypass $http_upgrade;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For
  $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
  }
